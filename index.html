<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#6C4EE3" />
<title>Wer hat heute Geburtstag?</title>
<style>
  :root {
    --accent: #6C4EE3;
    --accent-dark: #5539c2;
    --bg: #0f0e17;
    --card: #1c1a2b;
    --text: #f4f3ff;
    --text-dim: #a9a5c9;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  header {
    padding: 24px 4px 12px;
    text-align: center;
  }
  header h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    font-weight: 700;
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  .input-card {
    background: var(--card);
    border-radius: 20px;
    padding: 20px;
    margin: 12px 0 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  #mic-btn {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, var(--accent), var(--accent-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(108, 78, 227, 0.45);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #mic-btn:active { transform: scale(0.94); }
  #mic-btn.listening {
    animation: pulse 1.2s infinite;
    background: linear-gradient(145deg, var(--danger), #c23b3b);
    box-shadow: 0 8px 24px rgba(255, 107, 107, 0.45);
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.5); }
    70% { box-shadow: 0 0 0 18px rgba(255, 107, 107, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
  }
  #mic-btn svg { width: 36px; height: 36px; fill: white; }

  #status-text {
    min-height: 1.2em;
    font-size: 0.92rem;
    color: var(--text-dim);
    text-align: center;
  }

  .manual-row {
    display: flex;
    gap: 8px;
    width: 100%;
  }
  .manual-row input[type="date"] {
    flex: 1;
    background: #100e1c;
    border: 1px solid #34314a;
    color: var(--text);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 0.95rem;
  }
  .manual-row button {
    background: #302a4d;
    color: var(--text);
    border: none;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 0.9rem;
    cursor: pointer;
  }

  #result-heading {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 4px 0 10px;
    display: none;
  }

  #results {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 24px;
  }

  .person-card {
    background: var(--card);
    border-radius: 16px;
    padding: 12px;
    display: flex;
    gap: 12px;
    align-items: center;
    text-decoration: none;
    color: var(--text);
  }
  .rank {
    flex-shrink: 0;
    width: 26px;
    text-align: center;
    font-weight: 700;
    color: var(--text-dim);
    font-size: 0.85rem;
  }
  .thumb {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: #302a4d;
  }
  .thumb-placeholder {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    flex-shrink: 0;
    background: #302a4d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
  }
  .person-info { min-width: 0; }
  .person-name {
    font-weight: 600;
    font-size: 0.98rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .person-meta {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 2px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  #empty-state {
    text-align: center;
    color: var(--text-dim);
    margin-top: 40px;
    font-size: 0.92rem;
    line-height: 1.5;
    padding: 0 20px;
  }

  footer {
    text-align: center;
    color: #55507a;
    font-size: 0.72rem;
    padding: 10px 0 20px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🎂 Wer hat heute Geburtstag?</h1>
    <p>Sprich ein Datum – oder wähl es aus</p>
  </header>

  <div class="input-card">
    <button id="mic-btn" aria-label="Datum sprechen">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <div id="status-text">Tippe aufs Mikrofon und sag z. B. „10. März“</div>
    <div class="manual-row">
      <input type="date" id="date-input" />
      <button id="date-go">Los</button>
    </div>
  </div>

  <h2 id="result-heading"></h2>
  <div id="results"></div>
  <div id="empty-state">
    Noch keine Suche gestartet. Die Datenbank lädt im Hintergrund und wird danach ohne Verzögerung durchsucht.
  </div>

  <footer>Bekanntheit basiert auf Abrufzahlen der deutschen Wikipedia (letzte 30 Tage)</footer>
</div>

<script>
(function () {
  const micBtn = document.getElementById("mic-btn");
  const statusText = document.getElementById("status-text");
  const dateInput = document.getElementById("date-input");
  const dateGo = document.getElementById("date-go");
  const resultsEl = document.getElementById("results");
  const resultHeading = document.getElementById("result-heading");
  const emptyState = document.getElementById("empty-state");

  let database = null;
  let dbLoadError = false;

  // Datenbank sofort im Hintergrund laden, damit die Suche später
  // ohne Verzögerung erfolgen kann
  fetch("data/birthdays.json")
    .then((r) => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then((data) => {
      database = data;
    })
    .catch((err) => {
      dbLoadError = true;
      statusText.textContent = "Datenbank konnte nicht geladen werden.";
      console.error(err);
    });

  const MONTHS = {
    "januar": 1, "jänner": 1,
    "februar": 2,
    "märz": 3, "maerz": 3,
    "april": 4,
    "mai": 5,
    "juni": 6,
    "juli": 7,
    "august": 8,
    "september": 9,
    "oktober": 10,
    "november": 11,
    "dezember": 12
  };

  function pad(n) { return String(n).padStart(2, "0"); }

  // Versucht, aus gesprochenem/getipptem deutschen Text ein Datum (MM-DD) zu extrahieren
  function parseSpokenDate(text) {
    if (!text) return null;
    const lower = text.toLowerCase().trim();

    if (lower.includes("heute")) {
      const now = new Date();
      return { month: now.getMonth() + 1, day: now.getDate() };
    }

    const dayMatch = lower.match(/\b(\d{1,2})\b/);
    let month = null;
    for (const name in MONTHS) {
      if (lower.includes(name)) { month = MONTHS[name]; break; }
    }
    // Format "10.3." oder "10/3" ohne Monatsnamen
    if (!month) {
      const numeric = lower.match(/\b(\d{1,2})[.\/\-](\d{1,2})\b/);
      if (numeric) {
        return { day: parseInt(numeric[1], 10), month: parseInt(numeric[2], 10) };
      }
    }
    if (dayMatch && month) {
      return { day: parseInt(dayMatch[1], 10), month };
    }
    return null;
  }

  function showResultsFor(month, day) {
    if (!month || !day || month < 1 || month > 12 || day < 1 || day > 31) {
      statusText.textContent = "Das habe ich leider nicht verstanden. Bitte erneut versuchen.";
      return;
    }
    const key = pad(month) + "-" + pad(day);
    const dateLabel = new Intl.DateTimeFormat("de-DE", { day: "numeric", month: "long" })
      .format(new Date(2024, month - 1, day));

    if (!database) {
      statusText.textContent = dbLoadError
        ? "Datenbank nicht verfügbar."
        : "Datenbank lädt noch, bitte kurz warten…";
      return;
    }

    const people = database[key] || [];
    emptyState.style.display = "none";
    resultHeading.style.display = "block";
    resultHeading.textContent = "🎉 Geburtstage am " + dateLabel;
    statusText.textContent = people.length
      ? people.length + " Personen gefunden"
      : "Keine Einträge für dieses Datum in der Datenbank.";

    resultsEl.innerHTML = "";
    people.forEach((p, i) => {
      const card = document.createElement("a");
      card.className = "person-card";
      card.href = p.wikipediaUrl || "#";
      card.target = "_blank";
      card.rel = "noopener";

      const rank = document.createElement("div");
      rank.className = "rank";
      rank.textContent = i + 1;
      card.appendChild(rank);

      if (p.thumbnail) {
        const img = document.createElement("img");
        img.className = "thumb";
        img.src = p.thumbnail;
        img.alt = p.name;
        img.loading = "lazy";
        card.appendChild(img);
      } else {
        const ph = document.createElement("div");
        ph.className = "thumb-placeholder";
        ph.textContent = "🙂";
        card.appendChild(ph);
      }

      const info = document.createElement("div");
      info.className = "person-info";
      const name = document.createElement("div");
      name.className = "person-name";
      name.textContent = p.name + (p.year ? " (" + p.year + ")" : "");
      const meta = document.createElement("div");
      meta.className = "person-meta";
      meta.textContent = p.description || "";
      info.appendChild(name);
      info.appendChild(meta);
      card.appendChild(info);

      resultsEl.appendChild(card);
    });
  }

  // --- Spracheingabe ---
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizing = false;
  let recognizer = null;

  if (SpeechRecognition) {
    recognizer = new SpeechRecognition();
    recognizer.lang = "de-DE";
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 3;

    recognizer.onstart = () => {
      recognizing = true;
      micBtn.classList.add("listening");
      statusText.textContent = "Ich höre zu…";
    };
    recognizer.onerror = (e) => {
      statusText.textContent = "Fehler bei der Spracherkennung: " + e.error;
    };
    recognizer.onend = () => {
      recognizing = false;
      micBtn.classList.remove("listening");
    };
    recognizer.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      statusText.textContent = "Verstanden: „" + transcript + "“";
      const parsed = parseSpokenDate(transcript);
      if (parsed) {
        showResultsFor(parsed.month, parsed.day);
      } else {
        statusText.textContent = "Konnte kein Datum aus „" + transcript + "“ erkennen.";
      }
    };

    micBtn.addEventListener("click", () => {
      if (recognizing) {
        recognizer.stop();
        return;
      }
      try {
        recognizer.start();
      } catch (e) {
        // start() während bereits laufender Session ignorieren
      }
    });
  } else {
    statusText.textContent = "Spracherkennung wird auf diesem Gerät nicht unterstützt. Bitte Datum unten wählen.";
    micBtn.style.opacity = "0.4";
    micBtn.style.cursor = "not-allowed";
  }

  // --- Manuelle Eingabe (Fallback, z. B. iPhone) ---
  dateGo.addEventListener("click", () => {
    if (!dateInput.value) {
      statusText.textContent = "Bitte zuerst ein Datum auswählen.";
      return;
    }
    const parts = dateInput.value.split("-"); // YYYY-MM-DD
    showResultsFor(parseInt(parts[1], 10), parseInt(parts[2], 10));
  });
})();
</script>
</body>
</html>
